name: Release

# "v0.1.0" gibi bir etiket gönderilince kurulum dosyasını derler ve taslak bir sürüm oluşturur.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - run: npm run build

      - run: cargo test
        working-directory: src-tauri

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Mola ${{ github.ref_name }}
          releaseBody: |
            Download **`Mola_*_x64-setup.exe`** below and run it.

            > Windows SmartScreen may warn that the app is from an unknown publisher, because the installer is not code-signed yet. Click **More info → Run anyway**.

            See the [README](https://github.com/furkanuysl/Mola#readme) for features and details.
          releaseDraft: true
          prerelease: false
